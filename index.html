<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>만기수산 | 민물장어</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #fdfaf6;
    color: #222;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap {
    max-width: 720px;
    width: 100%;
    text-align: center;
  }
  .logo {
    width: 100%;
    max-width: 640px;
    height: auto;
    display: block;
    margin: 0 auto 32px;
  }
  .badge {
    display: inline-block;
    background: #b5121b;
    color: #fff;
    font-size: 14px;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 16px;
    letter-spacing: 0.5px;
  }
  .notice {
    color: #666;
    font-size: 15px;
    line-height: 1.6;
  }
  footer {
    margin-top: 48px;
    font-size: 12px;
    color: #aaa;
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">준비 중</span>
    <img class="logo" src="/logo.png" alt="만기수산 민물장어 로고" />
    <p class="notice">만기수산 홈페이지를 준비하고 있어요.<br />곧 더 많은 내용으로 찾아뵙겠습니다.</p>
    <footer>&copy; 만기수산</footer>
  </div>
</body>
</html>
